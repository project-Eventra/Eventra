<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Catalog — Eventra</title>
  <meta name="description" content="Discover and register for university club events, hackathons, seminars, and cultural festivals on Eventra.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Section -->
  <main class="section" style="padding-top: 7.5rem; min-height: 85vh;">
    <div class="container">
      
      <!-- Page Header -->
      <div style="margin-bottom: 2.5rem;">
        <div class="section-badge">Campus Events</div>
        <h1 style="font-size: 2.75rem; margin-bottom: 0.75rem;">Explore Campus Events</h1>
        <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 600px;">
          Find upcoming competitions, symposiums, guest lectures, and cultural nights hosted by certified campus societies.
        </p>
      </div>

      <!-- Filters & Search Toolbar -->
      <div class="glass-card" style="padding: 1.5rem; margin-bottom: 2.5rem;">
        <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
          
          <!-- Search Bar -->
          <div style="flex: 1; min-width: 280px; position: relative;">
            <input 
              type="text" 
              id="event-search-input" 
              class="form-control" 
              placeholder="Search by event title, keyword, or venue..." 
              style="padding-left: 2.75rem;"
            >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>

          <!-- Category Pills -->
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="category-pills">
            <button class="btn btn-sm btn-primary cat-filter-btn" data-category="">All Categories</button>
            <button class="btn btn-sm btn-glass cat-filter-btn" data-category="Technology">Tech &amp; AI</button>
            <button class="btn btn-sm btn-glass cat-filter-btn" data-category="Cultural">Cultural &amp; Arts</button>
            <button class="btn btn-sm btn-glass cat-filter-btn" data-category="Sports">Sports</button>
            <button class="btn btn-sm btn-glass cat-filter-btn" data-category="Academic">Academic</button>
            <button class="btn btn-sm btn-glass cat-filter-btn" data-category="Leadership">Leadership</button>
          </div>

          <!-- View Mode Toggle -->
          <div style="display: flex; gap: 0.25rem; background: rgba(10, 14, 30, 0.8); padding: 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
            <button class="btn btn-sm btn-glass" id="view-grid-btn" style="border:none; padding: 0.4rem 0.75rem; background: rgba(255, 255, 255, 0.1);">Grid</button>
            <button class="btn btn-sm btn-glass" id="view-timeline-btn" style="border:none; padding: 0.4rem 0.75rem;">Timeline</button>
          </div>

        </div>
      </div>

      <!-- Events Grid View -->
      <div id="events-grid-view">
        <div id="all-events-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.75rem;">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Events Timeline View (Hidden by default) -->
      <div id="events-timeline-view" style="display: none; max-width: 820px; margin: 0 auto;">
        <div class="timeline-track" id="full-events-timeline">
          <!-- Dynamically populated -->
        </div>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border-top:none;">
      <div>&copy; 2026 Eventra. All rights reserved.</div>
      <div style="display:flex; gap:1.5rem;">
        <a href="index.html">Home</a>
        <a href="clubs.html">Clubs</a>
        <a href="javascript:void(0)" onclick="openFeedbackModal()">Feedback</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/events.js"></script>
  <script src="js/feedback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentSearch = '';
      let currentCategory = '';

      // Check URL params for category
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('cat');
      if (catParam) {
        if (catParam === 'tech') currentCategory = 'Technology';
        else if (catParam === 'cultural') currentCategory = 'Cultural';
        else if (catParam === 'sports') currentCategory = 'Sports';
        else if (catParam === 'academic') currentCategory = 'Academic';
        else currentCategory = catParam;
      }

      function refreshEvents() {
        loadEventsCatalog({
          containerId: 'all-events-grid',
          search: currentSearch,
          category: currentCategory,
          limit: 24
        });
      }

      // Initial load
      refreshEvents();
      loadTimeline('full-events-timeline');

      // Search input handler with debounce
      let searchTimeout;
      const searchInput = document.getElementById('event-search-input');
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          currentSearch = e.target.value.trim();
          refreshEvents();
        }, 350);
      });

      // Category filter buttons
      const catBtns = document.querySelectorAll('.cat-filter-btn');
      catBtns.forEach(btn => {
        const cat = btn.getAttribute('data-category');
        if (cat === currentCategory) {
          catBtns.forEach(b => b.className = 'btn btn-sm btn-glass cat-filter-btn');
          btn.className = 'btn btn-sm btn-primary cat-filter-btn';
        }

        btn.addEventListener('click', () => {
          catBtns.forEach(b => b.className = 'btn btn-sm btn-glass cat-filter-btn');
          btn.className = 'btn btn-sm btn-primary cat-filter-btn';
          currentCategory = cat;
          refreshEvents();
        });
      });

      // View switcher
      const gridView = document.getElementById('events-grid-view');
      const timelineView = document.getElementById('events-timeline-view');
      const gridBtn = document.getElementById('view-grid-btn');
      const timelineBtn = document.getElementById('view-timeline-btn');

      gridBtn.addEventListener('click', () => {
        gridView.style.display = 'block';
        timelineView.style.display = 'none';
        gridBtn.style.background = 'rgba(255, 255, 255, 0.1)';
        timelineBtn.style.background = 'transparent';
      });

      timelineBtn.addEventListener('click', () => {
        gridView.style.display = 'none';
        timelineView.style.display = 'block';
        timelineBtn.style.background = 'rgba(255, 255, 255, 0.1)';
        gridBtn.style.background = 'transparent';
      });

      if (window.location.hash === '#timeline') {
        timelineBtn.click();
      }
    });
  </script>
</body>
</html>
