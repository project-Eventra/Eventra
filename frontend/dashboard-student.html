<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Eventra</title>
  <meta name="description" content="View your registered events, event passes, and digital tickets on Eventra.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Dashboard Layout -->
  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div>
        <div class="sidebar-profile">
          <div class="sidebar-avatar" id="student-avatar">S</div>
          <div>
            <div class="sidebar-user-name" id="student-name">Student Name</div>
            <div class="sidebar-user-role" id="student-id-display">ID: -</div>
          </div>
        </div>

        <ul class="sidebar-menu">
          <li class="sidebar-item active" onclick="switchStudentTab('tickets')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <span>My Event Passes</span>
          </li>
          <li class="sidebar-item" onclick="window.location.href='events.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Browse Events</span>
          </li>
          <li class="sidebar-item" onclick="openFeedbackModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>Campus Feedback</span>
          </li>
        </ul>
      </div>

      <div>
        <button class="btn btn-sm btn-glass" onclick="handleLogout()" style="width: 100%;">
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Dashboard Content -->
    <main class="dashboard-main">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Student Portal</h1>
          <p class="dashboard-subtitle">Manage your event tickets, registrations, and society passes.</p>
        </div>
        <a href="events.html" class="btn btn-primary">
          <span>+ Find New Events</span>
        </a>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon-wrap stat-icon-cyan">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <div>
            <div class="stat-number" id="stat-total-reg">0</div>
            <div class="stat-label">Total Passes</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon-wrap stat-icon-emerald">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          </div>
          <div>
            <div class="stat-number" id="stat-upcoming-reg">0</div>
            <div class="stat-label">Upcoming Events</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon-wrap stat-icon-purple">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          </div>
          <div>
            <div class="stat-number" id="stat-confirmed-reg">0</div>
            <div class="stat-label">Confirmed Status</div>
          </div>
        </div>
      </div>

      <!-- Passes & Registrations Container -->
      <div style="margin-top: 2rem;">
        <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 1.25rem;">My Active Tickets</h2>
        
        <div id="tickets-list">
          <div style="text-align: center; padding: 4rem 0;">
            <div style="width: 40px; height: 40px; border: 3px solid rgba(0, 242, 254, 0.2); border-top-color: var(--accent-cyan); border-radius: 50%; animation: rotateRing 1s linear infinite; margin: 0 auto 1rem;"></div>
            <p style="color:var(--text-muted);">Retrieving your registration passes...</p>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/feedback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = window.api.getUser();
      if (!user) {
        window.location.href = 'auth.html?mode=login';
        return;
      }

      // Populate user info
      document.getElementById('student-name').innerText = user.name || user.email.split('@')[0];
      document.getElementById('student-avatar').innerText = (user.name || user.email).charAt(0).toUpperCase();
      document.getElementById('student-id-display').innerText = user.student_id ? `ID: ${user.student_id}` : (user.department || user.email);

      await loadRegistrations();
    });

    async function loadRegistrations() {
      const list = document.getElementById('tickets-list');
      try {
        const res = await window.api.get('/student/registrations');
        const registrations = res.data || [];

        document.getElementById('stat-total-reg').innerText = registrations.length;
        document.getElementById('stat-upcoming-reg').innerText = registrations.filter(r => new Date(r.event_start_time || r.start_time) > new Date()).length;
        document.getElementById('stat-confirmed-reg').innerText = registrations.filter(r => r.status === 'confirmed').length;

        if (registrations.length === 0) {
          list.innerHTML = `
            <div class="glass-card" style="text-align: center; padding: 4rem 2rem;">
              <div style="font-size: 3rem; margin-bottom: 0.75rem;">🎟️</div>
              <h3 style="font-size: 1.3rem; margin-bottom: 0.5rem;">No Event Passes Found</h3>
              <p style="color: var(--text-muted); max-width: 420px; margin: 0 auto 1.5rem;">
                You haven't registered for any campus events yet. Explore upcoming hackathons, fests, and workshops!
              </p>
              <a href="events.html" class="btn btn-primary">Discover Events</a>
            </div>
          `;
          return;
        }

        list.innerHTML = registrations.map(reg => {
          const eventDate = new Date(reg.event_start_time || reg.start_time || reg.created_at).toLocaleDateString('en-US', {
            weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
          });
          const eventTime = new Date(reg.event_start_time || reg.start_time || reg.created_at).toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit'
          });

          const regCode = (reg.id || 'PASS').substring(0, 8).toUpperCase();
          const qrSvg = generateSimpleQRCodeSVG(regCode);

          return `
            <div class="ticket-pass">
              <div class="ticket-notch-top"></div>
              <div class="ticket-notch-bottom"></div>

              <div class="ticket-main">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                  <span class="badge badge-purple">${escapeHtml(reg.club_name || 'University Club')}</span>
                  <span class="badge ${reg.status === 'confirmed' ? 'badge-emerald' : 'badge-amber'}">${escapeHtml(reg.status || 'Confirmed')}</span>
                </div>

                <h3 style="font-size:1.45rem; font-weight:800; margin-bottom:0.6rem;">
                  <a href="event-detail.html?id=${reg.event_id}" style="color:var(--text-main);">${escapeHtml(reg.event_title || 'Campus Event')}</a>
                </h3>

                <div style="display:flex; flex-wrap:wrap; gap:1.5rem; font-size:0.88rem; color:var(--text-muted); margin-bottom:1rem;">
                  <div>📅 <strong>${eventDate}</strong> at ${eventTime}</div>
                  <div>📍 <strong>${escapeHtml(reg.venue || 'Campus Auditorium')}</strong></div>
                  ${reg.team_name ? `<div>👥 Team: <strong>${escapeHtml(reg.team_name)}</strong></div>` : '<div>👤 Individual Pass</div>'}
                </div>

                <div style="font-size:0.8rem; color:var(--text-dim);">
                  Registered on: ${new Date(reg.created_at).toLocaleDateString('en-US')}
                </div>
              </div>

              <div class="ticket-stub">
                <div class="ticket-qr">
                  ${qrSvg}
                </div>
                <div class="ticket-code">PASS: ${regCode}</div>
                <div style="font-size:0.7rem; color:var(--text-dim); margin-top:0.25rem;">Show at Entrance Gate</div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        list.innerHTML = `
          <div class="glass-card" style="text-align: center; padding: 3rem;">
            <p style="color: var(--accent-rose); margin-bottom: 1rem;">Could not load registrations: ${err.message}</p>
            <button class="btn btn-sm btn-glass" onclick="loadRegistrations()">Retry</button>
          </div>
        `;
      }
    }

    function generateSimpleQRCodeSVG(code) {
      // Clean modern geometric QR placeholder svg
      return `
        <svg width="86" height="86" viewBox="0 0 100 100" fill="#070913">
          <rect width="100" height="100" fill="#ffffff" />
          <rect x="10" y="10" width="25" height="25" />
          <rect x="15" y="15" width="15" height="15" fill="#ffffff" />
          <rect x="18" y="18" width="9" height="9" />
          <rect x="65" y="10" width="25" height="25" />
          <rect x="70" y="15" width="15" height="15" fill="#ffffff" />
          <rect x="73" y="18" width="9" height="9" />
          <rect x="10" y="65" width="25" height="25" />
          <rect x="15" y="70" width="15" height="15" fill="#ffffff" />
          <rect x="18" y="73" width="9" height="9" />
          <rect x="45" y="10" width="10" height="10" />
          <rect x="45" y="30" width="10" height="20" />
          <rect x="20" y="45" width="20" height="10" />
          <rect x="55" y="45" width="15" height="15" />
          <rect x="75" y="45" width="15" height="10" />
          <rect x="45" y="65" width="10" height="25" />
          <rect x="65" y="65" width="25" height="10" />
          <rect x="65" y="80" width="15" height="10" />
        </svg>
      `;
    }
  </script>
</body>
</html>
