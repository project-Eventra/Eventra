services:
  # Evenrtra Go Backend + Embedded Frontend Static Server
  - type: web
    name: evenrtra-app
    runtime: go
    plan: free
    region: oregon
    buildCommand: cd backend && go build -o ../server ./cmd/server
    startCommand: ./server
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evenrtra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: evenrtra
      - key: JWT_AUDIENCE
        value: evenrtra-web
      - key: COOKIE_DOMAIN
        value: onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: RATE_LIMIT_RPS
        value: "25"
      - key: RATE_LIMIT_BURST
        value: "60"

databases:
  # Managed PostgreSQL Database
  - name: evenrtra-db
    plan: free
    region: oregon
    databaseName: evenrtra
    user: evenrtra_user
